        <h1 style="text-align: center;">Elements, Etiquetes i Anidament</h1>

        <li>Els elements són les unitats bàsiques d'un document HTML, representats per etiquetes.</li>
        <li>Les etiquetes poden contenir text, altres etiquetes o atributs.</li>
