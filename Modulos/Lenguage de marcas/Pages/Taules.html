         <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taules</title>
</head>
<body>
        <h1 style="text-align: center;">Taules</h1>
    <ul>
        <li>Contenidor principal: <b>table</b></li>
        <li>Files: <b>tr</b></li>
        <li>Cèl·lules: <b>td</b> (dades) o <b>th</b> (capçalera)</li>
        <li>Atributs tradicionals: <b>border</b>, <b>cellpadding</b> i <b>cellspacing</b>.</li>
    </ul>

    <p>Exemple de taula:</p>
    <table border="1" >
        <tr>
            <th>Nom</th>
            <th>Edat</th>
            <th>Ciutat</th>
        </tr>
        <tr>
            <td>Ana</td>
            <td>25</td>
            <td>Barcelona</td>
        </tr>
        <tr>
            <td>Luis</td>
            <td>30</td>
            <td>Madrid</td>
        </tr>
    </table>
</body>
</html>
